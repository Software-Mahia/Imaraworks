# Continuous integration: run the Django test suite on every push and PR,
# so a change that breaks a test is caught before it is merged into main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"   # matches the team's local venv
          cache: pip               # reuse downloaded packages between runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        # Fails if someone changed a model but forgot to commit its migration.
        # Uses the dev settings, the default for manage.py (#24).
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Check production settings are deploy-safe
        # Fails the build if prod.py loses any of Django's deployment
        # protections (HTTPS redirect, secure cookies, HSTS, DEBUG off) (#24).
        # The values are stand-ins: the key is generated fresh each run, so no
        # secret is committed, and SQLite avoids needing a Postgres server.
        env:
          DJANGO_SETTINGS_MODULE: imaraworks.settings.prod
          DJANGO_ALLOWED_HOSTS: ci.example.com
          DATABASE_URL: sqlite:///ci-check.sqlite3
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'from django.core.management.utils import get_random_secret_key as g; print(g())')"
          python manage.py check --deploy --fail-level WARNING
