{% load static %}<!DOCTYPE html>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{% static 'frontend/app.css' %}">
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImaraWorks · My Requests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F;
    --navy-dark: #16293F;
    --amber: #C9812B;
    --amber-dark: #A6691F;
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --border: #E1E4E1;
    --text: #1F2933;
    --text-soft: #5A6472;
    --status-pending-bg: #FBF0DF;
    --status-pending-text: #8A5A15;
    --status-approved-bg: #E4F1EA;
    --status-approved-text: #2F7D5B;
    --status-rejected-bg: #F7E7E2;
    --status-rejected-text: #B3492B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .topbar .brand {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.2px;
  }

  .topbar .brand span {
    color: var(--amber);
  }

  .topbar .who {
    font-size: 13px;
    color: #C7D2DE;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .page-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .page-head h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    padding: 10px 18px;
  }

  .btn-primary {
    background: var(--amber);
    color: #fff;
  }

  .btn-primary:hover { background: var(--amber-dark); }

  .btn-secondary {
    background: transparent;
    color: var(--text-soft);
    border: 1px solid var(--border);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .panel h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .field-row {
    display: flex;
    gap: 16px;
    margin-bottom: 14px;
  }

  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--text-soft);
    flex: 1;
    margin-bottom: 14px;
  }

  .field-row label { margin-bottom: 0; }

  input, select, textarea {
    font-family: inherit;
    font-size: 14px;
    color: var(--text);
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }

  textarea { resize: vertical; min-height: 60px; }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    text-align: left;
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }

  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-pending { background: var(--status-pending-bg); color: var(--status-pending-text); }
  .badge-approved { background: var(--status-approved-bg); color: var(--status-approved-text); }
  .badge-rejected { background: var(--status-rejected-bg); color: var(--status-rejected-text); }

  #empty-state {
    color: var(--text-soft);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }
  #message { background: var(--status-approved-bg); color: var(--status-approved-text); border-radius: 8px; padding: 12px 16px; font-size: 14px; margin-bottom: 16px; }
  #message.error { background: var(--status-rejected-bg); color: var(--status-rejected-text); }
  .status-note { font-size: 12px; color: var(--text-soft); margin-top: 4px; }
  .signout { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.45); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; margin-left: 12px; cursor: pointer; }
  .signout:hover { background: rgba(255, 255, 255, 0.12); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ImaraWorks <span>· Vendor Payments</span></div>
  <div class="who"><span id="who"></span> <a id="back-link" href="/login/" hidden style="color:#fff;margin-left:12px">Back to my work</a><button type="button" class="signout" id="logout-btn">Sign out</button></div>
</header>

<main class="container" id="app" hidden>
  <div class="page-head">
    <h1>My payment requests</h1>
    <button class="btn-primary" id="toggle-form-btn">+ New request</button>
  </div>

  <div id="message" role="status" hidden></div>
  <section class="panel" id="new-request-panel" hidden>
    <h2>New request</h2>
    <form id="request-form">
      <div class="field-row">
        <label>Vendor
          <select name="vendor" required><option value="">Loading...</option></select>
        </label>
        <label>Amount (KES)
          <input name="amount" type="number" min="0.01" step="0.01" required>
        </label>
      </div>
      <div class="field-row">
        <label>Invoice reference
          <input name="invoice_number" required maxlength="100">
        </label>
        <label>Project
          <select name="project" required><option value="">Loading...</option></select>
        </label>
      </div>
      <label>Payment method
        <select name="payment_method">
          <option value="MPESA">M-Pesa</option>
          <option value="BANK_TRANSFER">Bank transfer</option>
          <option value="CASH">Cash</option>
        </select>
      </label>
      <label>Reason for payment
        <textarea name="reason" required></textarea>
      </label>
      <label>Supporting notes
        <textarea name="notes"></textarea>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Submit request</button>
        <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <table>
      <thead>
        <tr>
          <th>Vendor</th>
          <th>Amount (KES)</th>
          <th>Invoice</th>
          <th>Status</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="requests-body"></tbody>
    </table>
    <p id="empty-state" hidden>No requests yet — submit your first one above.</p>
  </section>
</main>

<script src="{% static 'frontend/auth.js' %}"></script>
<script>
  // ---- State: the signed-in user and their requests, loaded from the API after the role check ----
  let ME = null;
  let requests = [];

  const form = document.getElementById("request-form");
  const panel = document.getElementById("new-request-panel");
  const messageBox = document.getElementById("message");

  function showMessage(text, isError) {
    messageBox.textContent = text;   // textContent: nothing from the server is ever run as HTML
    messageBox.className = isError ? "error" : "";
    messageBox.hidden = false;
  }

  const STATUS = {
    DRAFT:            { label: "Draft",                cls: "badge-pending",  note: "Not sent for approval yet" },
    SUBMITTED:        { label: "Submitted",            cls: "badge-pending",  note: "" },
    PENDING_APPROVAL: { label: "Waiting for approval", cls: "badge-pending",  note: "" },
    APPROVED:         { label: "Approved",             cls: "badge-approved", note: "Waiting for Finance to pay" },
    REJECTED:         { label: "Rejected",             cls: "badge-rejected", note: "" },
    PROCESSING:       { label: "Payment in progress",  cls: "badge-pending",  note: "" },
    PAID:             { label: "Paid",                 cls: "badge-approved", note: "" },
    FAILED:           { label: "Payment failed",       cls: "badge-rejected", note: "Finance will retry" },
  };
  const LEVEL_NAME = { manager: "a manager", finance: "Finance" };

  // "Waiting on a manager and Finance", from the approval block when the API sends one.
  function waitingOn(r) {
    if (r.status !== "PENDING_APPROVAL") return "";   // the approval block is sent for every status; only a pending request is waiting on anyone
    const order = l => (l === "manager" ? 0 : 1);
    const levels = ((r.approval && r.approval.outstanding_levels) || []).slice().sort((a, b) => order(a) - order(b));
    return levels.length ? "Waiting on " + levels.map(l => LEVEL_NAME[l] || l).join(" and ") : "";
  }

  const FIELD_LABELS = {
    vendor: "Vendor", project: "Project", amount: "Amount", reason: "Reason",
    invoice_number: "Invoice number", payment_method: "Payment method", date: "Date", notes: "Notes",
  };

  // Turns an API error body like {"amount": ["..."]} into plain-language lines.
  function describeErrors(body) {
    const lines = [];
    for (const [field, messages] of Object.entries(body || {})) {
      const list = Array.isArray(messages) ? messages : [String(messages)];
      if (field === "non_field_errors") {
        lines.push(list.some(m => m.includes("unique set"))
          ? "A request for this vendor and invoice number already exists. Check the invoice number."
          : list.join(" "));
      } else if (field === "detail") {
        lines.push(list.join(" "));
      } else {
        lines.push((FIELD_LABELS[field] || field) + ": " + list.join(" "));
      }
    }
    return lines.length ? lines : ["Something went wrong."];
  }

  async function readJson(res) {
    try { return await res.json(); } catch (err) { return {}; }
  }

  function cell(text) {
    const td = document.createElement("td");
    td.textContent = text;
    return td;
  }

  function renderRequests() {
    const body = document.getElementById("requests-body");
    body.replaceChildren();
    document.getElementById("empty-state").hidden = requests.length > 0;

    requests.forEach(r => {
      const info = STATUS[r.status] || { label: r.status, cls: "badge-pending", note: "" };
      const row = document.createElement("tr");
      row.append(cell(r.vendor_name), cell(Number(r.amount).toLocaleString()), cell(r.invoice_number));

      const statusCell = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + info.cls;
      badge.textContent = info.label;
      statusCell.append(badge);
      const note = waitingOn(r) || info.note;
      if (note) {
        const small = document.createElement("div");
        small.className = "status-note";
        small.textContent = note;
        statusCell.append(small);
      }

      const actions = document.createElement("td");
      if (r.status === "DRAFT") {   // a draft that never got submitted can be sent from here
        const btn = document.createElement("button");
        btn.className = "btn-secondary";
        btn.textContent = "Submit";
        btn.addEventListener("click", () => submitDraft(r.id, btn));
        actions.append(btn);
      }

      row.append(statusCell, cell(r.date), actions);
      body.append(row);
    });
  }

  function fillSelect(select, items) {
    select.replaceChildren(new Option("Choose...", ""));
    items.forEach(item => select.append(new Option(item.name, item.id)));
  }

  async function loadChoices() {
    const [v, p] = await Promise.all([AUTH.apiFetch("/api/vendors/"), AUTH.apiFetch("/api/projects/")]);
    if (!v.ok || !p.ok) { showMessage("Could not load vendors and projects. Reload the page to try again.", true); return; }
    fillSelect(form.elements.vendor, await v.json());
    fillSelect(form.elements.project, await p.json());
  }

  async function loadRequests() {
    const res = await AUTH.apiFetch("/api/payment-requests/");
    if (!res.ok) { showMessage("Could not load your requests.", true); return; }
    const all = await res.json();
    // Managers and Finance get every request from the API; this page lists only the ones they raised.
    requests = ME.role === "EMPLOYEE" ? all : all.filter(r => r.requester === ME.id);
    renderRequests();
  }

  async function submitDraft(id, button) {
    button.disabled = true;
    try {
      const res = await AUTH.apiFetch(`/api/payment-requests/${id}/submit/`, { method: "POST" });
      const body = await readJson(res);
      if (res.ok) {
        requests = requests.map(r => (r.id === id ? body : r));
        showMessage("Request submitted for approval.", false);
        renderRequests();
      } else if (res.status === 409) {
        showMessage("This request was already submitted. Reloading your list.", true);
        await loadRequests();
      } else {
        showMessage(describeErrors(body).join(" "), true);
        button.disabled = false;
      }
    } catch (err) {
      console.error(err);
      showMessage("Could not reach the server. Please try again.", true);
      button.disabled = false;
    }
  }

  // ---- Form toggle ----
  document.getElementById("toggle-form-btn").addEventListener("click", () => { panel.hidden = !panel.hidden; });
  document.getElementById("cancel-btn").addEventListener("click", () => { panel.hidden = true; });

  // ---- Create the request, then submit it ----
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const button = form.querySelector("button[type=submit]");
    button.disabled = true;   // no double submit
    messageBox.hidden = true;
    try {
      const f = form.elements;
      const createRes = await AUTH.apiFetch("/api/payment-requests/", {
        method: "POST",
        body: JSON.stringify({
          vendor: Number(f.vendor.value),
          project: Number(f.project.value),
          amount: f.amount.value,
          reason: f.reason.value.trim(),
          invoice_number: f.invoice_number.value.trim(),
          payment_method: f.payment_method.value,
          date: new Date().toLocaleDateString("en-CA"),   // today, as YYYY-MM-DD in local time
          notes: f.notes.value.trim(),
        }),
      });
      const created = await readJson(createRes);
      if (!createRes.ok) { showMessage(describeErrors(created).join(" "), true); return; }

      const submitRes = await AUTH.apiFetch(`/api/payment-requests/${created.id}/submit/`, { method: "POST" });
      const submitted = await readJson(submitRes);
      if (submitRes.ok) {
        requests.unshift(submitted);
        showMessage("Request submitted for approval.", false);
      } else {
        requests.unshift(created);   // it exists, as a draft
        showMessage("Saved as a draft, but submitting failed: " + describeErrors(submitted).join(" ") +
                    " Use the Submit button on its row to try again.", true);
      }
      renderRequests();
      form.reset();
      panel.hidden = true;
    } catch (err) {
      showMessage("Something went wrong. Check your connection and try again.", true);
    } finally {
      button.disabled = false;
    }
  });
  // ---- Role check: employees, managers and Finance may raise requests here. Convenience only; the API enforces the rules. ----
  (async () => {
    const me = await AUTH.requireRole(["EMPLOYEE", "MANAGER", "FINANCE"]);
    if (!me) return;
    ME = me;
    // wrong role or no session: the browser is already being redirected
    const name = `${me.first_name} ${me.last_name}`.trim() || me.username;
    const roleLabel = { EMPLOYEE: "Employee", MANAGER: "Manager", FINANCE: "Finance Officer" }[me.role];
    document.getElementById("who").textContent = `${name} · ${roleLabel}`;
    if (me.role !== "EMPLOYEE") {   // managers and Finance can raise requests too: give them a way back
      const back = document.getElementById("back-link");
      back.href = AUTH.homeFor(me.role);
      back.hidden = false;
    }
    document.getElementById("app").hidden = false;
    await Promise.all([loadChoices(), loadRequests()]);   // the real data loads inside the guard, so wrong-role users never hit the API
  })();
  document.getElementById("logout-btn").addEventListener("click", () => AUTH.logout());
</script>

</body>
</html>
