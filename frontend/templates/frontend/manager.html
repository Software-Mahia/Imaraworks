<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImaraWorks · Awaiting Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F;
    --amber: #C9812B;
    --amber-dark: #A6691F;
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --border: #E1E4E1;
    --text: #1F2933;
    --text-soft: #5A6472;
    --late-text: #8A5A15;
    --danger: #B3492B;
    --success-bg: #E4F1EA;
    --success-text: #2F7D5B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar .brand { font-weight: 700; font-size: 16px; }
  .topbar .brand span { color: var(--amber); }
  .topbar .who { font-size: 13px; color: #C7D2DE; }

  .container { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

  .page-head { margin-bottom: 24px; }
  .page-head h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .page-head p { margin: 0; font-size: 14px; color: var(--text-soft); }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    padding: 8px 14px;
  }
  .btn-primary { background: var(--amber); color: #fff; }
  .btn-primary:hover { background: var(--amber-dark); }
  .btn-secondary { background: transparent; color: var(--text-soft); border: 1px solid var(--border); }
  .btn-reject { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn-reject:hover { border-color: var(--danger); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }

  #banner {
    background: var(--success-bg);
    color: var(--success-text);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  .sub { display: block; font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .late { color: var(--late-text); font-weight: 600; }
  .actions { display: flex; gap: 8px; }
  .own-note { font-size: 12px; color: var(--text-soft); max-width: 190px; }

  #empty-state { color: var(--text-soft); font-size: 14px; padding: 24px 0; text-align: center; }

  dialog {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 420px;
    max-width: 90vw;
    font-family: inherit;
    color: var(--text);
  }
  dialog::backdrop { background: rgba(31, 41, 51, 0.45); }
  dialog h2 { font-size: 16px; margin: 0 0 6px; }
  dialog p { font-size: 13px; color: var(--text-soft); margin: 0 0 14px; }
  dialog textarea {
    width: 100%;
    min-height: 90px;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }
  .dialog-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ImaraWorks <span>· Vendor Payments</span></div>
  <div class="who">Carol Wanjiku · Manager</div>
</header>

<main class="container">
  <div class="page-head">
    <h1>Awaiting your approval</h1>
    <p>Oldest requests are listed first.</p>
  </div>

  <div id="banner" role="status" hidden></div>

  <section class="panel">
    <table>
      <thead>
        <tr>
          <th>Request</th>
          <th>Requested by</th>
          <th>Amount (KES)</th>
          <th>Waiting</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="queue-body"></tbody>
    </table>
    <p id="empty-state" hidden>Nothing is waiting on you. New requests will appear here.</p>
  </section>
</main>

<dialog id="reject-dialog">
  <form id="reject-form">
    <h2>Reject this request</h2>
    <p id="reject-target"></p>
    <textarea id="reject-reason" placeholder="Why is this being rejected? The requester will see this." required></textarea>
    <div class="dialog-actions">
      <button type="button" class="btn-secondary" id="reject-cancel">Cancel</button>
      <button type="submit" class="btn-reject">Reject request</button>
    </div>
  </form>
</dialog>

<script>
  // ---- SETTINGS ----
  // Placeholder: the real logged-in user will come from the API (e.g. a "who am I" endpoint).
  const CURRENT_USER = "Carol Wanjiku";
  const FINANCE_THRESHOLD = 50000; // requests above this also need Finance sign-off

  // ---- PLACEHOLDER DATA ----
  // Remove this block once the API exists and use loadQueue() below instead.
  const hoursAgo = h => new Date(Date.now() - h * 3600 * 1000).toISOString();

  let requests = [
    { id: 1, vendor: "SwiftHaul Logistics", amount: 67000, invoice_ref: "SH-820", project: "Westlands", purpose: "Material transport", requester: "Alice Mwangi", submitted_at: hoursAgo(75) },
    { id: 2, vendor: "PowerHire Kenya", amount: 42000, invoice_ref: "PH-912", project: "Kilimani", purpose: "Excavator rental", requester: "Brian Otieno", submitted_at: hoursAgo(20) },
    { id: 3, vendor: "Metro Hardware Ltd.", amount: 24500, invoice_ref: "INV-1032", project: "Westlands", purpose: "Site materials", requester: "Alice Mwangi", submitted_at: hoursAgo(3) },
    { id: 4, vendor: "Prime Cement Supplies", amount: 18000, invoice_ref: "PC-2201", project: "Kilimani", purpose: "Cement for foundation", requester: "Carol Wanjiku", submitted_at: hoursAgo(6) },
  ];

  // ---- HELPERS ----
  // Escapes text before it goes into innerHTML, so a vendor name like "<script>" can't run as code.
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function waitingLabel(iso) {
    const h = Math.floor((Date.now() - new Date(iso)) / 3600000);
    if (h < 1) return { text: "Under an hour", late: false };
    if (h < 24) return { text: h + (h === 1 ? " hour" : " hours"), late: false };
    const d = Math.floor(h / 24);
    return { text: d + (d === 1 ? " day" : " days"), late: h >= 48 };
  }

  function showBanner(message) {
    const banner = document.getElementById("banner");
    banner.textContent = message;
    banner.hidden = false;
  }

  // ---- RENDER ----
  function render() {
    const body = document.getElementById("queue-body");
    const empty = document.getElementById("empty-state");
    body.innerHTML = "";

    const sorted = [...requests].sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));
    empty.hidden = sorted.length > 0;

    sorted.forEach(r => {
      const wait = waitingLabel(r.submitted_at);
      const isOwn = r.requester === CURRENT_USER;
      const needsFinance = r.amount > FINANCE_THRESHOLD;

      // NOTE: disabling approval of your own request here is only feedback for the user.
      // The backend must enforce this rule too; the UI alone is never enough.
      const actionsCell = isOwn
        ? `<span class="own-note">You submitted this, so another manager needs to approve it.</span>`
        : `<div class="actions">
             <button class="btn-primary" data-action="approve" data-id="${r.id}">Approve</button>
             <button class="btn-reject" data-action="reject" data-id="${r.id}">Reject</button>
           </div>`;

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>
          ${esc(r.vendor)}
          <span class="sub">${esc(r.purpose)}</span>
          <span class="sub">Invoice ${esc(r.invoice_ref)}, ${esc(r.project)} project</span>
        </td>
        <td>${esc(r.requester)}</td>
        <td>
          ${Number(r.amount).toLocaleString()}
          ${needsFinance ? '<span class="sub">Finance also signs off after you</span>' : ''}
        </td>
        <td class="${wait.late ? 'late' : ''}">${wait.text}</td>
        <td>${actionsCell}</td>
      `;
      body.appendChild(row);
    });
  }

  // ---- SWAP-IN POINT 1: load the queue from the API ----
  // async function loadQueue() {
  //   const response = await fetch('/api/requests/?status=pending_approval', {
  //     headers: { 'Authorization': 'Token ' + yourToken }
  //   });
  //   requests = await response.json();
  //   render();
  // }
  // loadQueue();

  render();

  // ---- APPROVE ----
  async function approve(id) {
    const r = requests.find(x => x.id === id);

    // ---- SWAP-IN POINT 2: call the approve endpoint (URL is a guess, confirm with the backend) ----
    // const response = await fetch(`/api/requests/${id}/approve/`, {
    //   method: 'POST',
    //   headers: { 'Authorization': 'Token ' + yourToken }
    // });
    // if (!response.ok) { showBanner('Could not approve this request.'); return; }

    requests = requests.filter(x => x.id !== id);
    render();
    showBanner(r.amount > FINANCE_THRESHOLD
      ? `Approved ${r.vendor}. It now goes to Finance for the second approval.`
      : `Approved ${r.vendor}. It is ready for Finance to pay.`);
  }

  // ---- REJECT (reason is required) ----
  const dialog = document.getElementById("reject-dialog");
  const reasonBox = document.getElementById("reject-reason");
  let rejectingId = null;

  function openReject(id) {
    const r = requests.find(x => x.id === id);
    rejectingId = id;
    document.getElementById("reject-target").textContent = `${r.vendor}, KES ${Number(r.amount).toLocaleString()}`;
    reasonBox.value = "";
    dialog.showModal();
  }

  document.getElementById("reject-cancel").addEventListener("click", () => dialog.close());

  document.getElementById("reject-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const reason = reasonBox.value.trim();
    if (!reason) return;
    const r = requests.find(x => x.id === rejectingId);

    // ---- SWAP-IN POINT 3: call the reject endpoint with the reason (URL is a guess) ----
    // const response = await fetch(`/api/requests/${rejectingId}/reject/`, {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json', 'Authorization': 'Token ' + yourToken },
    //   body: JSON.stringify({ reason })
    // });
    // if (!response.ok) { showBanner('Could not reject this request.'); return; }

    requests = requests.filter(x => x.id !== rejectingId);
    dialog.close();
    render();
    showBanner(`Rejected ${r.vendor}. Your reason has been recorded.`);
  });

  // ---- Button clicks (one listener for the whole table) ----
  document.getElementById("queue-body").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.dataset.action === "approve") approve(id);
    if (btn.dataset.action === "reject") openReject(id);
  });
</script>

</body>
</html>
