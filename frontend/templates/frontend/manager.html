{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImaraWorks · Awaiting Approval</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E3A5F;
    --amber: #C9812B;
    --amber-dark: #A6691F;
    --bg: #F6F7F5;
    --surface: #FFFFFF;
    --border: #E1E4E1;
    --text: #1F2933;
    --text-soft: #5A6472;
    --late-text: #8A5A15;
    --danger: #B3492B;
    --success-bg: #E4F1EA;
    --success-text: #2F7D5B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .topbar {
    background: var(--navy);
    color: #fff;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar .brand { font-weight: 700; font-size: 16px; }
  .topbar .brand span { color: var(--amber); }
  .topbar .who { font-size: 13px; color: #C7D2DE; }

  .container { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }

  .page-head { margin-bottom: 24px; }
  .page-head h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .page-head p { margin: 0; font-size: 14px; color: var(--text-soft); }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: none;
    padding: 8px 14px;
  }
  .btn-primary { background: var(--amber); color: #fff; }
  .btn-primary:hover { background: var(--amber-dark); }
  .btn-secondary { background: transparent; color: var(--text-soft); border: 1px solid var(--border); }
  .btn-reject { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn-reject:hover { border-color: var(--danger); }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }

  #banner {
    background: var(--success-bg);
    color: var(--success-text);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 16px;
  }

    #banner.error { background: #F7E7E2; color: var(--danger); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 600;
    padding: 0 12px 10px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 14px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  .sub { display: block; font-size: 12px; color: var(--text-soft); margin-top: 3px; }
  .late { color: var(--late-text); font-weight: 600; }
  .actions { display: flex; gap: 8px; }
  .own-note { font-size: 12px; color: var(--text-soft); max-width: 190px; }

  #empty-state { color: var(--text-soft); font-size: 14px; padding: 24px 0; text-align: center; }

  dialog {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 420px;
    max-width: 90vw;
    font-family: inherit;
    color: var(--text);
  }
  dialog::backdrop { background: rgba(31, 41, 51, 0.45); }
  dialog h2 { font-size: 16px; margin: 0 0 6px; }
  dialog p { font-size: 13px; color: var(--text-soft); margin: 0 0 14px; }
  dialog textarea {
    width: 100%;
    min-height: 90px;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    resize: vertical;
  }
  .dialog-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ImaraWorks <span>· Vendor Payments</span></div>
  <div class="who"><span id="who"></span> <a href="/employee/" style="color:#fff;margin-left:12px">My requests</a></div>
</header>

<main class="container" id="app" hidden>
  <div class="page-head">
    <h1>Awaiting your approval</h1>
    <p>Oldest requests are listed first.</p>
  </div>

  <div id="banner" role="status" hidden></div>

  <section class="panel">
    <table>
      <thead>
        <tr>
          <th>Request</th>
          <th>Requested by</th>
          <th>Amount (KES)</th>
          <th>Waiting</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="queue-body"></tbody>
    </table>
    <p id="empty-state" hidden>Nothing is waiting on you. New requests will appear here.</p>
  </section>
</main>

<dialog id="reject-dialog">
  <form id="reject-form">
    <h2>Reject this request</h2>
    <p id="reject-target"></p>
    <textarea id="reject-reason" placeholder="Why is this being rejected? This is recorded in the request's history." required></textarea>
    <div class="dialog-actions">
      <button type="button" class="btn-secondary" id="reject-cancel">Cancel</button>
      <button type="submit" class="btn-reject">Reject request</button>
    </div>
  </form>
</dialog>

<script src="{% static 'frontend/auth.js' %}"></script>
<script>
  // ---- State and elements ----
  let queue = [];
  const banner = document.getElementById("banner");
  const tbody = document.getElementById("queue-body");
  const emptyState = document.getElementById("empty-state");
  const LEVEL_NAME = { manager: "a manager", finance: "Finance" };

  // ---- Helpers ----
  function showBanner(message, isError) {
    banner.textContent = message;   // textContent: nothing from the server is ever run as HTML
    banner.className = isError ? "error" : "";
    banner.hidden = false;
  }

  async function readJson(res) {
    try { return await res.json(); } catch (err) { return {}; }
  }

  function errorText(body) {
    if (body && body.detail) return String(body.detail);
    const parts = Object.values(body || {}).flat().map(String);
    return parts.length ? parts.join(" ") : "Something went wrong.";
  }

  function waitingLabel(iso) {
    const h = Math.floor((Date.now() - new Date(iso)) / 3600000);
    if (h < 1) return { text: "Under an hour", late: false };
    if (h < 24) return { text: h + (h === 1 ? " hour" : " hours"), late: false };
    const d = Math.floor(h / 24);
    return { text: d + (d === 1 ? " day" : " days"), late: h >= 48 };
  }

  function makeButton(text, cls, onClick) {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = text;
    b.addEventListener("click", onClick);
    return b;
  }

  function sub(text) {
    const s = document.createElement("span");
    s.className = "sub";
    s.textContent = text;
    return s;
  }

  // ---- Render the queue ----
  function render() {
    tbody.replaceChildren();
    emptyState.hidden = queue.length > 0;

    queue.forEach(r => {
      const wait = waitingLabel(r.created_at);
      const others = ((r.approval && r.approval.outstanding_levels) || []).filter(l => l !== "manager");

      const requestCell = document.createElement("td");
      requestCell.append(document.createTextNode(r.vendor_name), sub(r.reason),
                         sub(`Invoice ${r.invoice_number}, ${r.project_name} project`));

      const requesterCell = document.createElement("td");
      requesterCell.textContent = r.requester_name || r.requester_username;

      const amountCell = document.createElement("td");
      amountCell.append(document.createTextNode(Number(r.amount).toLocaleString()));
      if (others.length) amountCell.append(sub(others.map(l => LEVEL_NAME[l] || l).join(" and ") + " also signs off after you"));

      const waitCell = document.createElement("td");
      waitCell.textContent = wait.text;
      if (wait.late) waitCell.className = "late";

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        makeButton("Approve", "btn-primary", () => approve(r, actions)),
        makeButton("Reject", "btn-reject", () => openReject(r)),
      );
      const actionCell = document.createElement("td");
      actionCell.append(actions);

      const row = document.createElement("tr");
      row.append(requestCell, requesterCell, amountCell, waitCell, actionCell);
      tbody.append(row);
    });
  }

  // ---- Load the queue: requests waiting on MY decision, oldest first ----
  async function loadQueue() {
    const res = await AUTH.apiFetch("/api/approvals/queue/");
    if (!res.ok) { showBanner("Could not load the approval queue.", true); return; }
    queue = await res.json();
    render();
  }

  // ---- Approve ----
  async function approve(r, actions) {
    const buttons = actions.querySelectorAll("button");
    buttons.forEach(b => { b.disabled = true; });   // a second click would only earn a 409
    const res = await AUTH.apiFetch(`/api/payment-requests/${r.id}/approve/`, { method: "POST" });
    const body = await readJson(res);
    if (res.ok) {
      const left = (body.approval && body.approval.outstanding_levels) || [];
      showBanner(left.length
        ? `Approved ${r.vendor_name}. Now waiting on ${left.map(l => LEVEL_NAME[l] || l).join(" and ")}.`
        : `Approved ${r.vendor_name}. It is ready for Finance to pay.`, false);
      await loadQueue();
      return;
    }
    showBanner(errorText(body), true);
    if (res.status === 404 || res.status === 409) await loadQueue();   // the request changed under us: reload
    else buttons.forEach(b => { b.disabled = false; });
  }

  // ---- Reject (a reason is required) ----
  const dialog = document.getElementById("reject-dialog");
  const reasonBox = document.getElementById("reject-reason");
  let rejecting = null;

  function openReject(r) {
    rejecting = r;
    document.getElementById("reject-target").textContent = `${r.vendor_name}, KES ${Number(r.amount).toLocaleString()}`;
    reasonBox.value = "";
    dialog.showModal();
  }

  document.getElementById("reject-cancel").addEventListener("click", () => dialog.close());

  document.getElementById("reject-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const reason = reasonBox.value.trim();
    if (!reason || !rejecting) return;
    const target = rejecting;
    const submit = e.target.querySelector("button[type=submit]");
    submit.disabled = true;
    const res = await AUTH.apiFetch(`/api/payment-requests/${target.id}/reject/`, {
      method: "POST",
      body: JSON.stringify({ reason }),
    });
    const body = await readJson(res);
    submit.disabled = false;
    dialog.close();
    if (res.ok) showBanner(`Rejected ${target.vendor_name}. Your reason has been recorded.`, false);
    else showBanner(errorText(body), true);
    await loadQueue();
  });
  // ---- Role check: only a MANAGER may see this page. Convenience only; the API enforces the rules. ----
    (async () => {
    const me = await AUTH.requireRole(["MANAGER"]);
    if (!me) return;
    const name = `${me.first_name} ${me.last_name}`.trim() || me.username;
    document.getElementById("who").textContent = `${name} · Manager`;
    document.getElementById("app").hidden = false;
    await loadQueue();   // the real data loads inside the guard, so wrong-role users never hit the API
  })();
</script>

</body>
</html>
